[project]
name = "aura-intelligence-hub"
version = "0.1.0"
description = "Enterprise Lakehouse and Competitive Intelligence Platform for Aura Energy Drink"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cryptography>=42.0.0",
    "dagster>=1.6.0",
    "httpx>=0.28.1",
    "langchain-core>=0.1.30",
    "langchain-openai>=0.1.0",
    "langgraph>=0.0.25",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pypdf>=4.1.0",
    "python-dotenv>=1.0.1",
    "reportlab>=4.1.0",
    "snowflake-connector-python>=3.7.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
